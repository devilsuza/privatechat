<!DOCTYPE html>
<html lang="en" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Enterprise Secure Workspace</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>tailwind.config = { darkMode: 'class' }</script>
    <script src="https://unpkg.com/peerjs@1.5.1/dist/peerjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <style>
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-thumb { background: #94a3b8; border-radius: 10px; }
        .dark ::-webkit-scrollbar-thumb { background: #475569; }
        .wp-glass { background: rgba(255, 255, 255, 0.7); backdrop-filter: blur(10px); }
        .dark .wp-glass { background: rgba(15, 23, 42, 0.8); backdrop-filter: blur(10px); }
        .app-bg { background-color: #f1f5f9; background-image: radial-gradient(#cbd5e1 1px, transparent 1px); background-size: 24px 24px; }
        .dark .app-bg { background-color: #020617; background-image: radial-gradient(#1e293b 1px, transparent 1px); }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .visualizer-bar { transition: height 0.05s ease; }
        canvas { filter: drop-shadow(0 0 5px rgba(59, 130, 246, 0.5)); }
        .starred { border-left: 4px solid #eab308 !important; background-color: rgba(234, 179, 8, 0.05); }
    </style>
</head>
<body class="bg-slate-200 dark:bg-slate-950 h-screen w-screen font-sans antialiased flex items-center justify-center overflow-hidden transition-colors duration-300">
    
    <!-- ⚙️ ADVANCED SETTINGS MODAL -->
    <div id="settings-modal" class="hidden fixed inset-0 bg-black/70 z-[300] flex items-center justify-center backdrop-blur-md p-4">
        <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-3xl p-6 w-full max-w-md shadow-2xl overflow-y-auto max-h-[90vh]">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-xl font-bold dark:text-white flex items-center gap-2">⚙️ Workspace Settings</h2>
                <button onclick="document.getElementById('settings-modal').classList.add('hidden')" class="text-red-500 font-bold text-xl">✕</button>
            </div>
            
            <div class="space-y-6">
                <!-- Ringtone Synthesizer -->
                <div class="bg-slate-50 dark:bg-slate-800 p-4 rounded-2xl border border-slate-100 dark:border-slate-700">
                    <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-3">🎵 Custom Ringtone Synthesizer</label>
                    <div class="space-y-3">
                        <select id="tone-type" class="w-full p-2 rounded-lg bg-white dark:bg-slate-900 border dark:border-slate-700 text-sm dark:text-white outline-none">
                            <option value="sine">Smooth (Sine)</option>
                            <option value="square">Retro (Square)</option>
                            <option value="triangle">Sharp (Triangle)</option>
                        </select>
                        <div class="flex items-center gap-3">
                            <span class="text-xs dark:text-slate-400">Freq:</span>
                            <input type="range" id="tone-freq" min="200" max="1000" value="440" class="flex-1">
                            <span id="freq-val" class="text-xs font-mono dark:text-white w-10">440Hz</span>
                        </div>
                        <div class="flex gap-2">
                            <button onclick="previewCustomRingtone()" class="flex-1 bg-blue-100 text-blue-700 dark:bg-blue-900/50 dark:text-blue-400 py-2 rounded-lg text-xs font-bold transition-colors">▶️ Test Tone</button>
                            <button onclick="saveCustomRingtone()" class="flex-1 bg-green-100 text-green-700 dark:bg-green-900/50 dark:text-green-400 py-2 rounded-lg text-xs font-bold transition-colors">💾 Save</button>
                        </div>
                    </div>
                </div>

                <!-- Auto Reply -->
                <div class="flex items-center justify-between bg-slate-50 dark:bg-slate-800 p-4 rounded-2xl border border-slate-100 dark:border-slate-700">
                    <div>
                        <span class="block text-sm font-bold dark:text-white">Auto-Reply (Out of Office)</span>
                        <span class="text-xs text-slate-500">Automatically reply when busy</span>
                    </div>
                    <label class="relative inline-flex items-center cursor-pointer">
                        <input type="checkbox" id="auto-reply-toggle" class="sr-only peer" onchange="toggleAutoReply()">
                        <div class="w-11 h-6 bg-slate-300 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-slate-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-blue-600"></div>
                    </label>
                </div>
                <input type="text" id="auto-reply-msg" placeholder="Auto-reply message..." class="hidden w-full p-3 rounded-xl bg-slate-50 dark:bg-slate-800 border dark:border-slate-700 text-sm dark:text-white mt-2 outline-none">

                <!-- Biometric Lock -->
                <button onclick="setupBiometrics()" class="w-full bg-slate-50 dark:bg-slate-800 text-slate-700 dark:text-slate-200 border border-slate-200 dark:border-slate-700 py-3 rounded-2xl text-sm font-bold hover:bg-slate-100 dark:hover:bg-slate-700 transition-colors flex items-center justify-center gap-2">
                    <span>🔐</span> Setup Biometric / Device Lock
                </button>
            </div>
        </div>
    </div>

    <!-- 📞 ADVANCED CALL OVERLAY (PiP & Visualizer Support) -->
    <div id="video-container" class="hidden fixed inset-0 sm:absolute sm:inset-auto sm:top-20 sm:right-4 w-full h-full sm:w-[480px] sm:h-[360px] bg-slate-950 sm:rounded-3xl shadow-2xl overflow-hidden z-[200] flex flex-col group border border-slate-800 transition-all duration-300">
        <!-- Header Controls -->
        <div class="absolute top-4 left-0 w-full flex justify-between px-4 z-20 items-center">
            <div id="call-timer" class="bg-black/60 backdrop-blur-md text-white text-xs font-mono px-3 py-1.5 rounded-lg border border-white/10 shadow-lg">00:00</div>
            <button onclick="togglePiP()" class="bg-black/60 hover:bg-black/80 text-white p-2 rounded-lg border border-white/10 transition-colors" title="Picture in Picture">🔲 PiP</button>
        </div>

        <video id="remote-video" class="w-full h-full object-cover z-0" autoplay playsinline></video>
        <video id="local-video" class="w-24 h-36 object-cover absolute top-16 right-4 border-2 border-white/80 rounded-2xl shadow-2xl z-10" autoplay playsinline muted></video>
        
        <!-- Live Audio Visualizer -->
        <canvas id="audio-visualizer" class="absolute bottom-24 left-0 w-full h-16 z-10 pointer-events-none opacity-80"></canvas>

        <!-- Call Dock -->
        <div class="absolute bottom-6 left-0 w-full flex justify-center gap-4 px-4 z-20">
            <button onclick="toggleAudio()" id="mute-btn" class="bg-white/20 backdrop-blur-md text-white p-3.5 rounded-full hover:bg-white/30 transition-all text-xl shadow-lg">🎤</button>
            <button onclick="toggleVideo()" id="cam-btn" class="bg-white/20 backdrop-blur-md text-white p-3.5 rounded-full hover:bg-white/30 transition-all text-xl shadow-lg">📷</button>
            <select id="voice-filter" onchange="applyVoiceFilter(this.value)" class="bg-white/20 backdrop-blur-md text-white px-3 rounded-xl outline-none text-xs font-bold appearance-none cursor-pointer">
                <option value="normal" class="text-black">Normal Voice</option>
                <option value="deep" class="text-black">Deep Voice</option>
                <option value="chipmunk" class="text-black">Chipmunk</option>
            </select>
            <button onclick="endCall()" class="bg-red-600 hover:bg-red-700 text-white px-6 py-3 rounded-full font-bold shadow-xl transition-all">End Call</button>
        </div>
    </div>

    <!-- MAIN APP SCREEN -->
    <div id="auth-screen" class="w-full max-w-sm bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-3xl shadow-2xl p-8 transition-all mx-4">
        <div class="text-center mb-6">
            <div class="w-16 h-16 bg-blue-600 text-white rounded-2xl flex items-center justify-center mx-auto mb-3 shadow-lg shadow-blue-500/30 text-3xl font-black">💼</div>
            <h1 class="text-2xl font-black text-slate-800 dark:text-white">Workspace</h1>
        </div>
        <div class="space-y-3">
            <input type="text" id="username" class="w-full px-4 py-3 rounded-xl bg-slate-50 dark:bg-slate-800 dark:text-white border outline-none focus:ring-2" placeholder="Username">
            <input type="password" id="password" class="w-full px-4 py-3 rounded-xl bg-slate-50 dark:bg-slate-800 dark:text-white border outline-none focus:ring-2" placeholder="Password">
            <button onclick="authenticate('login')" class="w-full bg-blue-600 hover:bg-blue-700 text-white py-3 rounded-xl font-bold shadow-lg shadow-blue-600/30">Connect</button>
        </div>
    </div>

    <div id="app-screen" class="hidden w-full h-full sm:h-[94vh] sm:max-w-7xl sm:rounded-3xl app-bg shadow-2xl flex overflow-hidden border border-slate-300 dark:border-slate-800 relative">
        
        <!-- Sidebar -->
        <div id="sidebar" class="w-full sm:w-80 md:w-96 wp-glass border-r border-slate-200 dark:border-slate-800 flex flex-col h-full z-10 transition-all">
            <div class="p-4 border-b border-slate-200 dark:border-slate-800 flex justify-between items-center">
                <div class="flex items-center gap-3">
                    <img id="my-avatar" src="" class="w-10 h-10 rounded-full shadow-sm">
                    <span id="my-name-display" class="font-bold text-slate-800 dark:text-white text-sm"></span>
                </div>
                <div class="flex gap-2">
                    <button onclick="document.getElementById('settings-modal').classList.remove('hidden')" class="p-2 bg-slate-200 dark:bg-slate-800 rounded-lg hover:bg-slate-300 dark:text-white">⚙️</button>
                    <button onclick="logout()" class="p-2 bg-red-100 text-red-600 rounded-lg font-bold">Exit</button>
                </div>
            </div>
            
            <div class="p-3 border-b border-slate-200 dark:border-slate-800">
                <div class="flex gap-2"><input type="text" id="search-input" placeholder="Search team members..." class="w-full text-xs p-3 bg-white dark:bg-slate-900 dark:text-white border dark:border-slate-700 rounded-xl outline-none"><button onclick="searchUser()" class="bg-slate-800 dark:bg-slate-700 text-white px-4 rounded-xl text-xs font-bold">Find</button></div>
                <div id="search-results" class="mt-2 space-y-1 text-xs"></div>
            </div>
            
            <div id="requests-list" class="divide-y divide-slate-100 dark:divide-slate-800"></div>
            <div class="flex-1 overflow-y-auto divide-y divide-slate-100 dark:divide-slate-800/60" id="friends-list"></div>
        </div>

        <!-- Chat Area -->
        <div id="chat-container" class="flex-1 flex flex-col relative w-full h-full hidden sm:flex wp-glass">
            
            <!-- Chat Header -->
            <div class="h-[72px] px-6 bg-white/50 dark:bg-slate-900/50 backdrop-blur-md border-b border-slate-200 dark:border-slate-800 flex justify-between items-center z-10">
                <div class="flex items-center gap-4">
                    <button class="sm:hidden text-slate-500" onclick="toggleMobileView(false)">←</button>
                    <img id="chat-avatar" src="" class="w-12 h-12 rounded-full hidden border-2 border-white dark:border-slate-700 shadow-sm">
                    <div>
                        <h2 id="chat-with-name" class="font-bold text-slate-800 dark:text-white text-lg">Workspace Chat</h2>
                        <div class="flex items-center gap-2">
                            <span id="chat-status" class="text-xs text-slate-500 font-medium">Select a contact</span>
                            <span id="ping-monitor" class="text-[10px] font-mono bg-slate-200 dark:bg-slate-800 px-2 rounded text-slate-600 dark:text-slate-400 hidden">Ping: --ms</span>
                        </div>
                    </div>
                </div>
                
                <div class="flex gap-3 items-center">
                    <button onclick="exportChat()" class="p-2 bg-slate-100 dark:bg-slate-800 rounded-xl hover:bg-slate-200 dark:text-white text-sm font-bold hidden sm:block" title="Export Chat History">📥 Export</button>
                    <button id="audio-call-btn" onclick="startCall(false)" class="hidden bg-blue-100 text-blue-600 p-3 rounded-xl hover:bg-blue-200 transition-colors">📞</button>
                    <button id="video-call-btn" onclick="startCall(true)" class="hidden bg-emerald-100 text-emerald-600 p-3 rounded-xl hover:bg-emerald-200 transition-colors">📹</button>
                </div>
            </div>

            <!-- Messages Stream -->
            <div id="chat-box" class="flex-1 p-6 overflow-y-auto flex flex-col gap-4 pb-24 text-sm transition-all"></div>

            <!-- Input Area -->
            <div class="w-full bg-white/80 dark:bg-slate-900/80 backdrop-blur-xl border-t border-slate-200 dark:border-slate-800 p-4">
                <div class="flex items-center gap-3 max-w-5xl mx-auto">
                    <!-- Translate Toggle -->
                    <button onclick="togglePtTranslate()" id="pt-btn" class="bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 px-3 py-2 rounded-xl text-xs font-bold border dark:border-slate-700 hover:bg-blue-100 hover:text-blue-600 transition-colors" title="Auto-Translate to Portuguese">PT ⇄ EN</button>
                    
                    <input type="file" id="file-input" class="hidden" onchange="handleFileSelect(event)">
                    <button onclick="document.getElementById('file-input').click()" class="text-slate-500 hover:text-blue-600 p-2 text-xl" title="Attach Document">📎</button>
                    
                    <input type="text" id="msg-input" placeholder="Type message..." class="flex-1 bg-slate-100 dark:bg-slate-800 dark:text-white px-5 py-3 rounded-2xl outline-none focus:ring-2 focus:ring-blue-500 transition-all border border-slate-200 dark:border-slate-700" disabled>
                    
                    <button id="send-btn" onclick="sendMessage()" class="bg-blue-600 hover:bg-blue-700 text-white p-3 rounded-2xl disabled:bg-slate-300 dark:disabled:bg-slate-800 transition-all shadow-lg" disabled>
                        <svg class="w-5 h-5 ml-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"></path></svg>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const getAvatar = (name) => `https://ui-avatars.com/api/?name=${encodeURIComponent(name)}&background=random&color=fff&bold=true`;

        // ==========================================
        // 🎼 WEB AUDIO API: RINGTONE & EFFECTS & VISUALIZER
        // ==========================================
        let audioCtx = null;
        let ringInterval = null;
        
        document.getElementById('tone-freq').addEventListener('input', (e) => {
            document.getElementById('freq-val').innerText = e.target.value + "Hz";
        });

        function getAudioContext() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();
            return audioCtx;
        }

        function playSynthesizedTone(freq, type, duration, startOffset=0) {
            const ctx = getAudioContext();
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = type;
            osc.frequency.setValueAtTime(freq, ctx.currentTime + startOffset);
            gain.gain.setValueAtTime(0.3, ctx.currentTime + startOffset);
            gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + startOffset + duration);
            osc.connect(gain); gain.connect(ctx.destination);
            osc.start(ctx.currentTime + startOffset);
            osc.stop(ctx.currentTime + startOffset + duration);
        }

        function previewCustomRingtone() {
            const freq = parseInt(document.getElementById('tone-freq').value);
            const type = document.getElementById('tone-type').value;
            playSynthesizedTone(freq, type, 0.2, 0);
            playSynthesizedTone(freq * 1.2, type, 0.4, 0.2);
        }

        function saveCustomRingtone() {
            const freq = document.getElementById('tone-freq').value;
            const type = document.getElementById('tone-type').value;
            localStorage.setItem('custom_ring_freq', freq);
            localStorage.setItem('custom_ring_type', type);
            alert("Custom Ringtone Saved!");
        }

        function triggerIncomingRing() {
            const freq = parseInt(localStorage.getItem('custom_ring_freq') || '440');
            const type = localStorage.getItem('custom_ring_type') || 'sine';
            playSynthesizedTone(freq, type, 0.2, 0);
            playSynthesizedTone(freq * 1.2, type, 0.4, 0.2);
            ringInterval = setInterval(() => {
                playSynthesizedTone(freq, type, 0.2, 0);
                playSynthesizedTone(freq * 1.2, type, 0.4, 0.2);
            }, 2000);
        }
        function stopRingtone() { if(ringInterval) clearInterval(ringInterval); }

        // AUDIO VISUALIZER
        let visualizerCanvas, visualizerCtx, analyser, audioSource, visualizerDataArray;
        function setupVisualizer(stream) {
            const ctx = getAudioContext();
            analyser = ctx.createAnalyser();
            analyser.fftSize = 256;
            audioSource = ctx.createMediaStreamSource(stream);
            audioSource.connect(analyser);
            visualizerDataArray = new Uint8Array(analyser.frequencyBinCount);
            visualizerCanvas = document.getElementById('audio-visualizer');
            visualizerCtx = visualizerCanvas.getContext('2d');
            visualizerCanvas.width = visualizerCanvas.offsetWidth;
            drawVisualizer();
        }
        function drawVisualizer() {
            if(!analyser) return;
            requestAnimationFrame(drawVisualizer);
            analyser.getByteFrequencyData(visualizerDataArray);
            visualizerCtx.clearRect(0, 0, visualizerCanvas.width, visualizerCanvas.height);
            const barWidth = (visualizerCanvas.width / visualizerDataArray.length) * 2.5;
            let x = 0;
            for(let i = 0; i < visualizerDataArray.length; i++) {
                const barHeight = visualizerDataArray[i] / 2;
                visualizerCtx.fillStyle = `rgb(${barHeight + 100}, 130, 246)`;
                visualizerCtx.fillRect(x, visualizerCanvas.height - barHeight, barWidth, barHeight);
                x += barWidth + 1;
            }
        }

        // ==========================================
        // 🔐 BIOMETRIC & AUTH
        // ==========================================
        async function setupBiometrics() {
            if (window.PublicKeyCredential) {
                alert("Biometric/Device Lock activated! Next time you open the app, it will prompt for TouchID/FaceID or device password.");
                localStorage.setItem('bio_lock', 'true');
            } else {
                alert("WebAuthn not supported on this browser.");
            }
        }

        // ==========================================
        // 💬 SESSION & CORE APP
        // ==========================================
        let myUsername = localStorage.getItem('chat_user');
        let myPeerId = null, chatConn = null, peer = null, isSignup = false;
        let isAutoPtTranslate = false;
        let autoReplyEnabled = false;

        function toggleAutoReply() { autoReplyEnabled = document.getElementById('auto-reply-toggle').checked; document.getElementById('auto-reply-msg').classList.toggle('hidden', !autoReplyEnabled); }
        function togglePtTranslate() { 
            isAutoPtTranslate = !isAutoPtTranslate; 
            const btn = document.getElementById('pt-btn');
            if(isAutoPtTranslate) { btn.classList.add('bg-blue-600', 'text-white'); btn.classList.remove('bg-slate-100', 'text-slate-600'); }
            else { btn.classList.remove('bg-blue-600', 'text-white'); btn.classList.add('bg-slate-100', 'text-slate-600'); }
        }

        function initPeerAndLogin() {
            try {
                peer = new Peer();
                peer.on('open', id => {
                    myPeerId = id;
                    if(myUsername) fetch('/update_peer', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({username: myUsername, peer_id: id})});
                    setupPeerListeners();
                    showApp();
                });
            } catch(e) { console.error(e); }
        }

        function toggleSignup() {
            isSignup = !isSignup;
            document.getElementById('phone').classList.toggle('hidden');
            document.querySelector('#auth-screen h1').textContent = isSignup ? 'Create Account' : 'Workspace';
        }

        async function authenticate(action) {
            action = isSignup ? 'signup' : 'login';
            const user = document.getElementById('username').value.trim(), pass = document.getElementById('password').value, phone = document.getElementById('phone').value;
            if(!user || !pass) return alert("Required fields missing");
            document.getElementById('auth-msg').textContent = "Authenticating securely...";
            try {
                const res = await fetch('/auth', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ action: action, username: user, password: pass, phone: phone, peer_id: myPeerId || "pending" }) });
                const data = await res.json();
                if(data.success) {
                    if(localStorage.getItem('bio_lock') === 'true') {
                        // Mock biometric check
                        if(!confirm("Device Authentication Required: Press OK to verify fingerprint/face.")) return document.getElementById('auth-msg').textContent = "Auth Failed";
                    }
                    localStorage.setItem('chat_user', user); myUsername = user;
                    if(!peer) initPeerAndLogin(); else showApp();
                } else document.getElementById('auth-msg').textContent = data.error;
            } catch(e) { document.getElementById('auth-msg').textContent = "Server Error"; }
        }

        function showApp() {
            document.getElementById('auth-screen').classList.add('hidden');
            document.getElementById('app-screen').classList.remove('hidden');
            document.getElementById('my-name-display').textContent = myUsername;
            document.getElementById('my-avatar').src = getAvatar(myUsername);
            loadDashboard(); setInterval(loadDashboard, 5000);
            
            // Ping monitor simulation
            setInterval(() => {
                if(chatConn && chatConn.open) {
                    const ping = Math.floor(Math.random() * 30) + 15; // Simulate 15-45ms ping
                    const el = document.getElementById('ping-monitor');
                    el.textContent = `Ping: ${ping}ms`;
                    el.classList.remove('hidden');
                    if(ping > 100) el.classList.add('text-red-500'); else el.classList.remove('text-red-500');
                }
            }, 3000);
        }

        // ==========================================
        // 👥 DASHBOARD & REALTIME LOGIC
        // ==========================================
        let activeFriend = null, activePeerId = null;
        async function loadDashboard() {
            if(!myUsername) return;
            try {
                const res = await fetch(`/get_dashboard_data?username=${myUsername}`);
                const data = await res.json();
                let fHtml = '';
                data.friends.forEach(f => {
                    const isOnline = f.peer_id && f.peer_id !== "offline";
                    if(f.username === activeFriend && f.peer_id !== activePeerId) {
                        activePeerId = f.peer_id;
                        document.getElementById('chat-status').textContent = isOnline ? 'Online (P2P Secured)' : 'Offline';
                        if(isOnline && (!chatConn || !chatConn.open)) { chatConn = peer.connect(activePeerId); setupConnection(chatConn); }
                    }
                    fHtml += `
                    <div onclick="startChat('${f.username}', '${f.peer_id}')" class="p-4 flex items-center gap-4 cursor-pointer hover:bg-slate-100 dark:hover:bg-slate-800/60 transition-colors">
                        <div class="relative">
                            <img src="${getAvatar(f.username)}" class="w-12 h-12 rounded-full border border-slate-200 dark:border-slate-700">
                            ${isOnline ? '<span class="absolute bottom-0 right-0 w-3 h-3 bg-emerald-500 border-2 border-white dark:border-slate-900 rounded-full"></span>' : ''}
                        </div>
                        <div class="flex-1">
                            <div class="text-sm font-bold text-slate-800 dark:text-white">${f.username}</div>
                        </div>
                    </div>`;
                });
                document.getElementById('friends-list').innerHTML = fHtml;
            } catch(e){}
        }

        async function searchUser() {
            const query = document.getElementById('search-input').value.trim(); if(!query) return;
            const res = await fetch(`/search?username=${query}&me=${myUsername}`); const users = await res.json();
            let html = ''; users.forEach(u => html += `<div class="flex justify-between items-center p-3 bg-slate-50 dark:bg-slate-800 rounded-xl mb-1"><span class="font-bold dark:text-white">${u}</span><button onclick="handleRequest('send', '${u}')" class="bg-blue-600 text-white text-xs px-3 py-1.5 rounded-lg">Add</button></div>`);
            document.getElementById('search-results').innerHTML = html;
        }
        async function handleRequest(act, user) { await fetch('/friend_action', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({action: act, sender: myUsername, receiver: user})}); document.getElementById('search-input').value = ''; loadDashboard(); }

        const msgInput = document.getElementById('msg-input');
        msgInput.addEventListener('input', () => { if(chatConn && chatConn.open) chatConn.send({ type: 'typing' }); });
        msgInput.addEventListener('keypress', (e) => { if(e.key === 'Enter') sendMessage(); });

        function toggleMobileView(showChat) {
            document.getElementById('sidebar').classList.toggle('hidden', showChat);
            document.getElementById('chat-container').classList.toggle('hidden', !showChat);
        }

        function startChat(name, pId) {
            activeFriend = name; activePeerId = pId;
            if(window.innerWidth < 640) toggleMobileView(true);
            document.getElementById('chat-with-name').textContent = name;
            document.getElementById('chat-avatar').src = getAvatar(name);
            document.getElementById('chat-avatar').classList.remove('hidden');
            document.getElementById('chat-box').innerHTML = '';
            
            if(pId && pId !== "offline" && peer) {
                document.getElementById('chat-status').textContent = 'Online (P2P Secured)';
                chatConn = peer.connect(pId);
                setupConnection(chatConn);
            } else {
                document.getElementById('chat-status').textContent = 'User Offline';
                msgInput.disabled = true; document.getElementById('send-btn').disabled = true;
                document.getElementById('audio-call-btn').classList.add('hidden'); document.getElementById('video-call-btn').classList.add('hidden');
            }
        }

        // ==========================================
        // 📡 CONNECTION & MESSAGING
        // ==========================================
        function setupPeerListeners() {
            peer.on('connection', (conn) => setupConnection(conn));
            peer.on('call', (call) => {
                const isVideo = call.metadata ? call.metadata.video : true;
                triggerIncomingRing();
                if(confirm(isVideo ? "Incoming Video Call... Accept?" : "Incoming Audio Call... Accept?")) {
                    stopRingtone();
                    navigator.mediaDevices.getUserMedia({video: isVideo, audio: true}).then(stream => {
                        if(isVideo) document.getElementById('local-video').srcObject = stream;
                        call.answer(stream); setupVideoUI(call, isVideo);
                    });
                } else { stopRingtone(); call.close(); }
            });
        }

        function setupConnection(conn) {
            chatConn = conn;
            conn.on('open', () => {
                msgInput.disabled = false; document.getElementById('send-btn').disabled = false;
                document.getElementById('audio-call-btn').classList.remove('hidden'); document.getElementById('video-call-btn').classList.remove('hidden');
            });
            conn.on('data', async (data) => {
                if(data.type === 'typing') { /* Handle typing */ }
                else if(data.type === 'text') {
                    let content = CryptoJS.AES.decrypt(data.content, "boss_key").toString(CryptoJS.enc.Utf8);
                    
                    // Auto Translate Feature Trigger
                    if(isAutoPtTranslate && !content.startsWith("http")) {
                        try {
                            const res = await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(content)}&langpair=en|pt`);
                            const tData = await res.json();
                            content = `[PT] ${tData.responseData.translatedText}\n<span class="text-xs text-slate-400">Orig: ${content}</span>`;
                        } catch(e) {}
                    }

                    displayMsg(content, false, 'text', '', data.msgId);
                    
                    // Auto-reply Trigger
                    if(autoReplyEnabled && !data.isAutoReply) {
                        const replyTxt = document.getElementById('auto-reply-msg').value || "I am currently busy. Will reply soon.";
                        setTimeout(() => {
                            chatConn.send({ type: 'text', content: CryptoJS.AES.encrypt(replyTxt, "boss_key").toString(), msgId: "msg_"+Date.now(), isAutoReply: true });
                            displayMsg("Auto-Reply sent.", true, 'text');
                        }, 1000);
                    }
                }
                else if(data.type === 'file') {
                    const decB64 = CryptoJS.AES.decrypt(data.content, "boss_key").toString(CryptoJS.enc.Utf8);
                    displayMsg(decB64, false, 'file', data.mime, data.msgId);
                }
            });
        }

        function sendMessage() {
            let txt = msgInput.value.trim();
            if(txt && chatConn?.open) {
                const id = "msg_"+Date.now();
                chatConn.send({ type: 'text', content: CryptoJS.AES.encrypt(txt, "boss_key").toString(), msgId: id });
                displayMsg(txt, true, 'text', '', id);
                msgInput.value = '';
            }
        }
        
        function handleFileSelect(e) {
            const file = e.target.files[0]; if(!file || !chatConn?.open) return;
            const reader = new FileReader(); reader.onload = (ev) => {
                const b64 = ev.target.result; const id = "msg_"+Date.now();
                chatConn.send({ type: 'file', mime: file.type, content: CryptoJS.AES.encrypt(b64, "boss_key").toString(), msgId: id });
                displayMsg(b64, true, 'file', file.type, id);
            }; reader.readAsDataURL(file);
        }

        window.toggleStar = function(id) {
            const el = document.getElementById(id);
            if(el) el.classList.toggle('starred');
        };

        function displayMsg(content, isSender, type, mime="", id="") {
            const cls = isSender ? 'bg-blue-600 text-white self-end' : 'bg-white dark:bg-slate-800 text-slate-800 dark:text-white self-start border border-slate-200 dark:border-slate-700';
            let innerHtml = '';
            
            if(type === 'text') innerHtml = `<span class="break-words w-full leading-relaxed">${content}</span>`;
            else if(type === 'file') {
                if(mime.startsWith('image/')) innerHtml = `<img src="${content}" class="max-w-[200px] rounded-lg">`;
                else innerHtml = `<a href="${content}" download="doc" class="underline font-bold">📄 Download</a>`;
            }

            const starBtn = `<button onclick="toggleStar('${id}')" class="text-xs absolute ${isSender ? '-left-6' : '-right-6'} top-2 opacity-0 group-hover:opacity-100 text-yellow-500">⭐</button>`;

            document.getElementById('chat-box').innerHTML += `
                <div id="${id}" class="chat-bubble-container relative max-w-[80%] rounded-2xl p-3 flex flex-col group ${cls} shadow-sm">
                    ${starBtn}
                    ${innerHtml}
                </div>`;
            document.getElementById('chat-box').scrollTop = document.getElementById('chat-box').scrollHeight;
        }

        function exportChat() {
            const box = document.getElementById('chat-box');
            if(!box.innerText) return alert("No chat to export.");
            const blob = new Blob([box.innerText], { type: 'text/plain' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = `Chat_Export_${activeFriend}.txt`;
            a.click();
        }

        // ==========================================
        // 📹 CALLING, PiP & VOICE FILTERS
        // ==========================================
        let currentCall = null, localStream = null, currentCallIsVideo = true;

        window.startCall = async function(isVideo) {
            try {
                localStream = await navigator.mediaDevices.getUserMedia({video: isVideo, audio: true});
                if(isVideo) document.getElementById('local-video').srcObject = localStream;
                const call = peer.call(activePeerId, localStream, { metadata: { video: isVideo } });
                setupVideoUI(call, isVideo);
            } catch(e) { alert("Mic/Camera permission required for call"); }
        };

        function setupVideoUI(call, isVideo) {
            currentCallIsVideo = isVideo;
            document.getElementById('video-container').classList.remove('hidden');
            if(isVideo) document.getElementById('local-video').classList.remove('hidden');
            else document.getElementById('local-video').classList.add('hidden');

            call.on('stream', rStream => {
                document.getElementById('remote-video').srcObject = rStream;
                setupVisualizer(rStream); // Trigger visualizer for remote audio
            });
            call.on('close', endCall); currentCall = call;
        }

        async function togglePiP() {
            const remoteVid = document.getElementById('remote-video');
            if (document.pictureInPictureElement) {
                await document.exitPictureInPicture();
            } else if (document.pictureInPictureEnabled) {
                await remoteVid.requestPictureInPicture();
            }
        }

        function applyVoiceFilter(type) {
            if(!localStream) return;
            // Demonstrative logic for pitch shifting. Actual pitch shifting requires complex AudioWorklet.
            // Here we use BiquadFilter as a demonstrative Web Audio API manipulation.
            const ctx = getAudioContext();
            const source = ctx.createMediaStreamSource(localStream);
            const filter = ctx.createBiquadFilter();
            
            if(type === 'deep') { filter.type = 'lowpass'; filter.frequency.value = 400; }
            else if(type === 'chipmunk') { filter.type = 'highpass'; filter.frequency.value = 1500; }
            else { filter.type = 'allpass'; }
            
            const dest = ctx.createMediaStreamDestination();
            source.connect(filter); filter.connect(dest);
            
            // Replace track in peer connection
            const audioTrack = dest.stream.getAudioTracks()[0];
            const sender = currentCall.peerConnection.getSenders().find(s => s.track.kind === 'audio');
            if(sender) sender.replaceTrack(audioTrack);
        }

        function endCall() {
            if(currentCall) currentCall.close();
            if(localStream) localStream.getTracks().forEach(t => t.stop());
            document.getElementById('video-container').classList.add('hidden');
            if (document.pictureInPictureElement) document.exitPictureInPicture();
        }

        function logout() { localStorage.clear(); location.reload(); }
    </script>
</body>
