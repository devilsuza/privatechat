<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure WhatsApp Clone</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/peerjs@1.5.1/dist/peerjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <style>
        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        .chat-bg { background-color: #efeae2; background-image: radial-gradient(#d1d5db 1px, transparent 1px); background-size: 20px 20px; }
        .status-ring { padding: 2px; background: linear-gradient(45deg, #f59e0b, #ec4899); border-radius: 50%; }
        /* Hide scrollbar for status list */
        .no-scrollbar::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="bg-slate-200 h-screen font-sans antialiased flex items-center justify-center overflow-hidden">
    
    <!-- OTP/Forgot Password Modal -->
    <div id="forgot-modal" class="hidden fixed inset-0 bg-black/50 z-50 flex items-center justify-center backdrop-blur-sm p-4">
        <div class="bg-white rounded-2xl p-6 w-full max-w-sm shadow-2xl">
            <h2 class="text-xl font-bold mb-4">Reset Password</h2>
            <div id="otp-step-1" class="space-y-3">
                <input type="text" id="reset-user" placeholder="Username" class="w-full p-2 border rounded">
                <input type="text" id="reset-phone" placeholder="Registered Phone No." class="w-full p-2 border rounded">
                <button onclick="requestOTP()" class="w-full bg-blue-600 text-white p-2 rounded">Send OTP</button>
                <button onclick="document.getElementById('forgot-modal').classList.add('hidden')" class="w-full text-slate-500 text-sm">Cancel</button>
            </div>
            <div id="otp-step-2" class="hidden space-y-3">
                <input type="text" id="reset-otp" placeholder="Enter OTP" class="w-full p-2 border rounded">
                <input type="password" id="reset-new-pass" placeholder="New Password" class="w-full p-2 border rounded">
                <button onclick="verifyOTP()" class="w-full bg-green-600 text-white p-2 rounded">Reset Password</button>
            </div>
            <p id="reset-msg" class="text-red-500 text-xs mt-2 text-center"></p>
        </div>
    </div>

    <!-- Status View Modal -->
    <div id="status-modal" class="hidden fixed inset-0 bg-black/90 z-50 flex flex-col items-center justify-center">
        <button onclick="document.getElementById('status-modal').classList.add('hidden')" class="absolute top-4 right-4 text-white p-2">✕ Close</button>
        <div class="text-white text-lg font-bold mb-4" id="status-viewer-name"></div>
        <div id="status-viewer-content" class="text-white text-3xl text-center max-w-md p-8 break-words"></div>
    </div>

    <!-- AUTH SCREEN -->
    <div id="auth-screen" class="w-full max-w-md bg-white rounded-2xl shadow-2xl p-8 transition-all mx-4">
        <div class="text-center mb-6">
            <h1 class="text-2xl font-bold text-slate-800">Login</h1>
        </div>
        <div class="space-y-3">
            <input type="text" id="username" class="w-full px-4 py-2 border rounded-lg bg-slate-50 outline-none focus:border-blue-500" placeholder="Username">
            <input type="password" id="password" class="w-full px-4 py-2 border rounded-lg bg-slate-50 outline-none focus:border-blue-500" placeholder="Password">
            <input type="text" id="phone" class="w-full px-4 py-2 border rounded-lg bg-slate-50 outline-none focus:border-blue-500 hidden" placeholder="Phone (Required for Signup)">
            
            <button onclick="authenticate('login')" class="w-full bg-blue-600 text-white py-2.5 rounded-lg font-semibold hover:bg-blue-700">Login</button>
            <div class="flex justify-between text-sm mt-2">
                <button onclick="toggleSignup()" id="toggle-btn" class="text-blue-600 hover:underline">New? Sign Up instead</button>
                <button onclick="document.getElementById('forgot-modal').classList.remove('hidden')" class="text-slate-500 hover:underline">Forgot Password?</button>
            </div>
            <p id="auth-msg" class="text-red-500 text-sm text-center"></p>
        </div>
    </div>

    <!-- MAIN APP SCREEN -->
    <div id="app-screen" class="hidden w-full h-full sm:h-[95vh] sm:max-w-6xl sm:rounded-2xl bg-white shadow-2xl flex overflow-hidden">
        
        <!-- Sidebar -->
        <div id="sidebar" class="w-full sm:w-80 md:w-96 bg-white border-r flex flex-col h-full z-10 transition-all">
            <div class="p-3 bg-slate-50 border-b flex justify-between items-center h-16">
                <div class="flex items-center gap-2">
                    <img id="my-avatar" src="" class="w-10 h-10 rounded-full border">
                    <span id="my-name-display" class="font-bold text-slate-800 text-sm"></span>
                </div>
                <button onclick="logout()" class="text-red-500 text-xs font-bold px-2">Logout</button>
            </div>
            
            <!-- Status Row -->
            <div class="p-3 border-b bg-slate-50">
                <div class="flex gap-2 items-center mb-2">
                    <input type="text" id="status-input" placeholder="Type a status..." class="text-xs p-1.5 border rounded flex-1">
                    <button onclick="postStatus()" class="bg-blue-500 text-white text-xs px-2 py-1.5 rounded">Post</button>
                </div>
                <div class="flex gap-3 overflow-x-auto no-scrollbar pb-1" id="status-list">
                    <!-- Statuses inject here -->
                </div>
            </div>

            <!-- Search & Requests -->
            <div class="p-2 border-b bg-white">
                <div class="flex gap-1">
                    <input type="text" id="search-input" placeholder="Search friends..." class="w-full text-xs p-2 bg-slate-100 rounded">
                    <button onclick="searchUser()" class="bg-blue-600 text-white text-xs px-3 rounded">Find</button>
                </div>
                <div id="search-results" class="mt-1 space-y-1 text-xs"></div>
            </div>
            <div id="requests-list" class="divide-y divide-slate-100 text-xs bg-yellow-50"></div>

            <!-- Friends -->
            <div class="flex-1 overflow-y-auto bg-white" id="friends-list"></div>
        </div>

        <!-- Chat Area -->
        <div id="chat-container" class="flex-1 flex flex-col bg-slate-50 relative w-full h-full hidden sm:flex">
            <!-- Header -->
            <div class="h-16 px-4 bg-white border-b flex justify-between items-center shadow-sm z-10">
                <div class="flex items-center gap-3">
                    <button class="sm:hidden text-slate-500" onclick="toggleMobileView(false)">← Back</button>
                    <img id="chat-avatar" src="" class="w-10 h-10 rounded-full hidden">
                    <div>
                        <h2 id="chat-with-name" class="font-semibold text-slate-800 text-base">Select a chat</h2>
                        <p id="chat-status" class="text-[10px] text-slate-500 hidden">Encrypted</p>
                    </div>
                </div>
                <button id="call-btn" class="hidden bg-green-100 text-green-700 p-2 rounded-full"><svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path d="M15 10l4.5-2.5A1 1 0 0121 8.5v7a1 1 0 01-1.5.85L15 14v-4zM5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"></path></svg></button>
            </div>
            
            <!-- Video Container (Responsive: Float on PC, Fullscreen on Mobile) -->
            <div id="video-container" class="hidden fixed inset-0 sm:absolute sm:inset-auto sm:top-20 sm:right-4 w-full h-full sm:w-80 sm:h-56 bg-slate-900 sm:rounded-2xl shadow-2xl overflow-hidden z-[100] flex flex-col transition-all">
                <video id="remote-video" class="w-full h-full object-cover" autoplay playsinline></video>
                <video id="local-video" class="w-24 h-32 sm:w-20 sm:h-28 object-cover absolute top-4 right-4 sm:bottom-4 sm:right-4 border-2 border-white rounded-xl shadow-lg" autoplay playsinline muted></video>
                
                <!-- Video Controls Panel -->
                <div class="absolute bottom-6 left-0 w-full flex justify-center gap-4 px-4">
                    <button id="mute-btn" onclick="toggleAudio()" class="bg-white/20 backdrop-blur text-white p-3 rounded-full hover:bg-white/40">🎤</button>
                    <button id="cam-btn" onclick="toggleVideo()" class="bg-white/20 backdrop-blur text-white p-3 rounded-full hover:bg-white/40">📷</button>
                    <button id="full-btn" onclick="toggleFullscreen()" class="hidden sm:block bg-white/20 backdrop-blur text-white p-3 rounded-full hover:bg-white/40">⛶</button>
                    <button onclick="endCall()" class="bg-red-600 text-white p-3 px-6 rounded-full font-bold shadow-lg hover:bg-red-700">End Call</button>
                </div>
            </div>

            <!-- Messages -->
            <div id="chat-box" class="flex-1 p-4 overflow-y-auto chat-bg flex flex-col gap-2"></div>

            <!-- Input -->
            <div class="p-2 bg-white border-t flex items-center gap-2">
                <input type="text" id="msg-input" placeholder="Message..." class="flex-1 bg-slate-100 px-4 py-2.5 rounded-full text-sm outline-none" disabled>
                <button id="send-btn" onclick="sendMessage()" class="bg-blue-600 text-white p-2.5 rounded-full disabled:bg-slate-300" disabled>➤</button>
            </div>
        </div>
    </div>

    <script>
        const getAvatar = (name) => `https://ui-avatars.com/api/?name=${name}&background=random&color=fff`;

        // 1. SESSION MANAGEMENT (5 Min Timeout)
        let myUsername = localStorage.getItem('chat_user');
        let lastActivity = localStorage.getItem('last_active');
        let myPeerId = null, chatConn = null, peer = null;
        let isSignup = false;

        function checkSession() {
            if (myUsername && lastActivity) {
                const now = new Date().getTime();
                if (now - parseInt(lastActivity) > 5 * 60 * 1000) { // 5 mins
                    logout(); // Auto logout
                } else {
                    updateActivity();
                    initPeerAndLogin();
                }
            }
        }
        function updateActivity() { localStorage.setItem('last_active', new Date().getTime()); }
        
        // Update activity on mouse/key press
        window.addEventListener('mousemove', updateActivity);
        window.addEventListener('keypress', updateActivity);
        
        setInterval(() => {
            if(myUsername) {
                const now = new Date().getTime();
                if (now - parseInt(localStorage.getItem('last_active')) > 5 * 60 * 1000) logout();
            }
        }, 10000); // Check every 10 secs

        // Initialize Peer
        function initPeerAndLogin() {
            try {
                peer = new Peer();
                peer.on('open', id => {
                    myPeerId = id;
                    // Update peer ID on server silently
                    if(myUsername) fetch('/update_peer', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({username: myUsername, peer_id: id})});
                    setupPeerListeners();
                    showApp();
                });
            } catch(e) { console.error("PeerJS blocked"); }
        }

        function toggleSignup() {
            isSignup = !isSignup;
            document.getElementById('phone').classList.toggle('hidden');
            document.querySelector('#auth-screen h1').textContent = isSignup ? 'Sign Up' : 'Login';
            document.querySelector('#toggle-btn').textContent = isSignup ? 'Already have an account? Login' : 'New? Sign Up instead';
        }

        async function authenticate(action) {
            action = isSignup ? 'signup' : 'login';
            const user = document.getElementById('username').value.trim();
            const pass = document.getElementById('password').value;
            const phone = document.getElementById('phone').value;
            
            if(!user || !pass) return alert("Fill required fields");
            document.getElementById('auth-msg').textContent = "Connecting...";
            
            try {
                const res = await fetch('/auth', {
                    method: 'POST', headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ action: action, username: user, password: pass, phone: phone, peer_id: myPeerId || "pending" })
                });
                const data = await res.json();
                if(data.success) {
                    localStorage.setItem('chat_user', user);
                    myUsername = user;
                    updateActivity();
                    if(!peer) initPeerAndLogin(); else showApp();
                } else {
                    document.getElementById('auth-msg').textContent = data.error;
                }
            } catch(e) { document.getElementById('auth-msg').textContent = "Server Error"; }
        }

        function showApp() {
            document.getElementById('auth-screen').classList.add('hidden');
            document.getElementById('app-screen').classList.remove('hidden');
            document.getElementById('my-name-display').textContent = myUsername;
            document.getElementById('my-avatar').src = getAvatar(myUsername);
            loadDashboard();
            // Start Auto-Refresh Data loop
            setInterval(loadDashboard, 5000); 
        }

        // Dashboard & Status Data (Real-time polling)
        let activeFriend = null, activePeerId = null;
        async function loadDashboard() {
            if(!myUsername) return;
            try {
                const res = await fetch(`/get_dashboard_data?username=${myUsername}`);
                const data = await res.json();
                
                // Requests
                let reqHtml = '';
                data.requests.forEach(r => reqHtml += `<div class="flex justify-between p-2"><span>${r}</span><button onclick="handleRequest('accept','${r}')" class="bg-green-500 text-white px-2 rounded">Accept</button></div>`);
                document.getElementById('requests-list').innerHTML = reqHtml;

                // Friends
                let fHtml = '';
                data.friends.forEach(f => {
                    const isOnline = f.peer_id && f.peer_id !== "offline";
                    // If this friend is currently active in chat, update their peerID for calls
                    if(f.username === activeFriend && f.peer_id !== activePeerId) {
                        activePeerId = f.peer_id;
                        document.getElementById('chat-status').textContent = isOnline ? 'Online' : 'Offline';
                        if(isOnline && (!chatConn || !chatConn.open)) { chatConn = peer.connect(activePeerId); setupConnection(chatConn); }
                    }
                    
                    fHtml += `
                    <div onclick="startChat('${f.username}', '${f.peer_id}')" class="p-3 flex items-center gap-3 border-b cursor-pointer hover:bg-slate-50">
                        <div class="relative"><img src="${getAvatar(f.username)}" class="w-10 h-10 rounded-full">${isOnline ? '<span class="absolute bottom-0 right-0 w-3 h-3 bg-green-500 border rounded-full"></span>':''}</div>
                        <div class="text-sm font-semibold">${f.username}</div>
                    </div>`;
                });
                document.getElementById('friends-list').innerHTML = fHtml || '<p class="p-4 text-xs text-slate-400">No friends yet.</p>';

                // Statuses
                let sHtml = '';
                data.statuses.forEach(s => {
                    sHtml += `
                    <div onclick="viewStatus('${s.username}', '${s.content}')" class="flex flex-col items-center gap-1 cursor-pointer min-w-[50px]">
                        <div class="status-ring"><img src="${getAvatar(s.username)}" class="w-10 h-10 rounded-full border-2 border-white"></div>
                        <span class="text-[10px] text-slate-600 truncate w-12 text-center">${s.username}</span>
                    </div>`;
                });
                document.getElementById('status-list').innerHTML = sHtml;

            } catch(e){}
        }

        async function postStatus() {
            const txt = document.getElementById('status-input').value;
            if(!txt) return;
            await fetch('/post_status', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({username: myUsername, content: txt})});
            document.getElementById('status-input').value = '';
            loadDashboard();
        }
        function viewStatus(name, txt) {
            document.getElementById('status-viewer-name').textContent = name + "'s Status";
            document.getElementById('status-viewer-content').textContent = txt;
            document.getElementById('status-modal').classList.remove('hidden');
        }

        // Search & Requests
        async function searchUser() {
            const query = document.getElementById('search-input').value;
            if(!query) return;
            const res = await fetch(`/search?username=${query}&me=${myUsername}`);
            const users = await res.json();
            let html = '';
            users.forEach(u => html += `<div class="flex justify-between p-2 border-b"><span>${u}</span> <button onclick="handleRequest('send', '${u}')" class="bg-blue-100 text-blue-700 px-2 rounded">Add</button></div>`);
            document.getElementById('search-results').innerHTML = html;
        }
        async function handleRequest(act, user) {
            await fetch('/friend_action', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({action: act, sender: myUsername, receiver: user})});
            document.getElementById('search-input').value = ''; document.getElementById('search-results').innerHTML = ''; loadDashboard();
        }

        // Chat UI & Logic
        function toggleMobileView(showChat) {
            if(showChat) {
                document.getElementById('sidebar').classList.add('hidden');
                document.getElementById('chat-container').classList.remove('hidden');
            } else {
                document.getElementById('chat-container').classList.add('hidden');
                document.getElementById('sidebar').classList.remove('hidden');
            }
        }

        function startChat(name, pId) {
            activeFriend = name; activePeerId = pId;
            if(window.innerWidth < 640) toggleMobileView(true);
            document.getElementById('chat-with-name').textContent = name;
            document.getElementById('chat-avatar').src = getAvatar(name); document.getElementById('chat-avatar').classList.remove('hidden');
            document.getElementById('chat-status').classList.remove('hidden');
            document.getElementById('chat-box').innerHTML = '';
            
            if(pId && pId !== "offline" && peer) {
                document.getElementById('chat-status').textContent = 'Online';
                chatConn = peer.connect(pId); setupConnection(chatConn);
            } else {
                document.getElementById('chat-status').textContent = 'Offline';
                document.getElementById('msg-input').disabled = true; document.getElementById('send-btn').disabled = true; document.getElementById('call-btn').classList.add('hidden');
            }
        }

        function setupPeerListeners() {
            peer.on('connection', (conn) => setupConnection(conn));
            peer.on('call', async (call) => {
                if(confirm("Incoming video call... Accept?")) {
                    try {
                        localStream = await navigator.mediaDevices.getUserMedia({video: true, audio: true});
                        document.getElementById('local-video').srcObject = localStream;
                        call.answer(localStream);
                        setupVideoUI(call);
                    } catch(e) { alert("Camera Error"); }
                } else call.close();
            });
        }

        function setupConnection(conn) {
            chatConn = conn;
            conn.on('open', () => {
                document.getElementById('msg-input').disabled = false; document.getElementById('send-btn').disabled = false; document.getElementById('call-btn').classList.remove('hidden');
            });
            conn.on('data', (data) => {
                if(data.type === 'text') {
                    const dec = CryptoJS.AES.decrypt(data.content, "boss_key").toString(CryptoJS.enc.Utf8);
                    displayMsg(dec, false);
                }
            });
        }

        function sendMessage() {
            const txt = document.getElementById('msg-input').value.trim();
            if(txt && chatConn?.open) {
                chatConn.send({ type: 'text', content: CryptoJS.AES.encrypt(txt, "boss_key").toString() });
                displayMsg(txt, true);
                document.getElementById('msg-input').value = '';
            }
        }
        function displayMsg(txt, isSender) {
            const cls = isSender ? 'bg-blue-600 text-white self-end' : 'bg-white text-slate-800 self-start border';
            document.getElementById('chat-box').innerHTML += `<div class="max-w-[75%] rounded-xl px-3 py-2 text-sm ${cls}">${txt}</div>`;
            document.getElementById('chat-box').scrollTop = document.getElementById('chat-box').scrollHeight;
        }

        // VIDEO CALL CONTROLS
        let currentCall = null;
        let audioEnabled = true, videoEnabled = true, isFull = false;

        document.getElementById('call-btn').onclick = async () => {
            try {
                localStream = await navigator.mediaDevices.getUserMedia({video: true, audio: true});
                document.getElementById('local-video').srcObject = localStream;
                const call = peer.call(activePeerId, localStream);
                setupVideoUI(call);
            } catch(e) { alert("Camera permission required!"); }
        };

        function setupVideoUI(call) {
            document.getElementById('video-container').classList.remove('hidden');
            call.on('stream', rStream => document.getElementById('remote-video').srcObject = rStream);
            call.on('close', endCall);
            currentCall = call;
            // Reset states
            audioEnabled = true; videoEnabled = true;
            document.getElementById('mute-btn').textContent = '🎤'; document.getElementById('cam-btn').textContent = '📷';
        }

        function toggleAudio() {
            if(!localStream) return;
            audioEnabled = !audioEnabled;
            localStream.getAudioTracks()[0].enabled = audioEnabled;
            document.getElementById('mute-btn').textContent = audioEnabled ? '🎤' : '🔇';
            document.getElementById('mute-btn').classList.toggle('bg-red-500', !audioEnabled);
        }
        function toggleVideo() {
            if(!localStream) return;
            videoEnabled = !videoEnabled;
            localStream.getVideoTracks()[0].enabled = videoEnabled;
            document.getElementById('cam-btn').textContent = videoEnabled ? '📷' : '🚫';
            document.getElementById('cam-btn').classList.toggle('bg-red-500', !videoEnabled);
        }
        function toggleFullscreen() {
            const vc = document.getElementById('video-container');
            if(!isFull) { vc.classList.add('fixed', 'inset-0', 'w-full', 'h-full', 'rounded-none'); vc.classList.remove('sm:absolute', 'sm:inset-auto', 'sm:top-20', 'sm:right-4', 'sm:w-80', 'sm:h-56', 'sm:rounded-2xl'); } 
            else { vc.classList.remove('fixed', 'inset-0', 'w-full', 'h-full', 'rounded-none'); vc.classList.add('sm:absolute', 'sm:inset-auto', 'sm:top-20', 'sm:right-4', 'sm:w-80', 'sm:h-56', 'sm:rounded-2xl'); }
            isFull = !isFull;
        }

        function endCall() {
            if(currentCall) currentCall.close();
            if(localStream) localStream.getTracks().forEach(t => t.stop());
            document.getElementById('video-container').classList.add('hidden');
        }

        function logout() {
            localStorage.removeItem('chat_user'); localStorage.removeItem('last_active');
            location.reload();
        }

        // OTP LOGIC (Mock demo)
        async function requestOTP() {
            const u = document.getElementById('reset-user').value;
            const p = document.getElementById('reset-phone').value;
            const res = await fetch('/request_otp', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({username: u, phone: p})});
            const data = await res.json();
            if(data.success) {
                alert("TESTING MODE: Your OTP is " + data.demo_otp + "\n(Real SMS requires Twilio API)");
                document.getElementById('otp-step-1').classList.add('hidden');
                document.getElementById('otp-step-2').classList.remove('hidden');
            } else { document.getElementById('reset-msg').textContent = data.error; }
        }

        async function verifyOTP() {
            const u = document.getElementById('reset-user').value;
            const otp = document.getElementById('reset-otp').value;
            const np = document.getElementById('reset-new-pass').value;
            const res = await fetch('/reset_password', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({username: u, otp: otp, new_password: np})});
            const data = await res.json();
            if(data.success) { alert("Password Reset Successfully!"); location.reload(); }
            else { document.getElementById('reset-msg').textContent = data.error; }
        }

        // Auto Boot Check
        checkSession();
    </script>
</body>
</html>
