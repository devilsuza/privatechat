<!DOCTYPE html>
<html lang="en" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Ultra Chat God-Level</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>tailwind.config = { darkMode: 'class' }</script>
    <script src="https://unpkg.com/peerjs@1.5.1/dist/peerjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        .dark ::-webkit-scrollbar-thumb { background: #475569; }
        .wp-default { background-color: #efeae2; background-image: radial-gradient(#d1d5db 1px, transparent 1px); background-size: 20px 20px; }
        .dark .wp-default { background-color: #0f172a; background-image: radial-gradient(#1e293b 1px, transparent 1px); }
        .wp-blue { background-color: #e0f2fe; background-image: url('https://www.transparenttextures.com/patterns/cubes.png'); }
        .dark .wp-blue { background-color: #0c4a6e; }
        .wp-pink { background-color: #fce7f3; background-image: url('https://www.transparenttextures.com/patterns/diamond-upholstery.png'); }
        .dark .wp-pink { background-color: #831843; }
        .status-ring { padding: 2px; background: linear-gradient(45deg, #f59e0b, #ec4899); border-radius: 50%; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .dot { animation: typing 1.4s infinite ease-in-out both; }
        .dot:nth-child(1) { animation-delay: -0.32s; }
        .dot:nth-child(2) { animation-delay: -0.16s; }
        @keyframes typing { 0%, 80%, 100% { transform: scale(0); } 40% { transform: scale(1); } }
        .reaction-pop { animation: popin 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        @keyframes popin { 0% { transform: scale(0); } 100% { transform: scale(1); } }
        .bomb-active { background-color: #ef4444; color: white !important; animation: pulse 1.5s infinite; }
        .locked-blur { filter: blur(15px) grayscale(100%); pointer-events: none; user-select: none; }
        .ptt-active { background-color: #ef4444 !important; transform: scale(1.1); animation: pulse 1s infinite; }
    </style>
</head>
<body class="bg-slate-200 dark:bg-slate-900 h-screen font-sans antialiased flex items-center justify-center overflow-hidden transition-colors duration-300">
    
    <!-- 📶 Offline Banner -->
    <div id="offline-banner" class="hidden fixed top-0 w-full bg-red-600 text-white text-center py-1 text-xs font-bold z-[200]">⚠️ NO INTERNET CONNECTION - You are offline</div>

    <!-- 🔢 App PIN Lock Overlay -->
    <div id="pin-lock-overlay" class="hidden fixed inset-0 z-[300] bg-slate-900 flex flex-col items-center justify-center text-white">
        <div class="bg-slate-800 p-8 rounded-2xl shadow-2xl text-center">
            <span class="text-6xl mb-4 block">🔒</span>
            <h2 class="text-2xl font-bold mb-4">Enter PIN to Unlock</h2>
            <input type="password" id="unlock-pin-input" maxlength="4" class="w-32 text-center text-2xl tracking-[0.5em] bg-slate-700 text-white px-4 py-2 rounded-lg outline-none focus:ring-2 focus:ring-blue-500 mx-auto block mb-4" placeholder="••••">
            <button onclick="unlockApp()" class="bg-blue-600 text-white px-6 py-2 rounded-full font-bold hover:bg-blue-700 w-full">Unlock</button>
            <p id="pin-error" class="text-red-500 text-xs mt-2 hidden">Incorrect PIN!</p>
        </div>
    </div>

    <!-- 🔐 Boss Lock Overlay -->
    <div id="lock-overlay" class="hidden fixed inset-0 z-[150] flex flex-col items-center justify-center bg-black/80 text-white cursor-pointer" onclick="toggleLock()">
        <span class="text-6xl mb-4">🔒</span><h2 class="text-2xl font-bold">Chat Locked</h2><p class="text-sm text-slate-400 mt-2">Click anywhere to unlock</p>
    </div>

    <!-- 📸 Selfie Modal -->
    <div id="selfie-modal" class="hidden fixed inset-0 bg-black/90 z-[60] flex items-center justify-center backdrop-blur-sm p-4">
        <div class="bg-white dark:bg-slate-800 rounded-2xl p-4 w-full max-w-sm shadow-2xl flex flex-col items-center">
            <div class="w-full flex justify-between items-center mb-2"><h2 class="font-bold dark:text-white">Quick Snap</h2><button onclick="closeSelfie()" class="text-red-500 font-bold text-xl">✕</button></div>
            <video id="selfie-video" class="w-full h-64 bg-black rounded-lg object-cover mb-4" autoplay playsinline></video>
            <canvas id="selfie-canvas" class="hidden"></canvas>
            <button onclick="captureSelfie()" class="bg-blue-600 w-16 h-16 rounded-full border-4 border-blue-300 hover:bg-blue-700 shadow-lg flex items-center justify-center"><span class="text-2xl">📸</span></button>
        </div>
    </div>

    <!-- ✏️ Draw Modal -->
    <div id="draw-modal" class="hidden fixed inset-0 bg-black/80 z-[60] flex items-center justify-center p-4">
        <div class="bg-white dark:bg-slate-800 rounded-2xl p-4 w-full max-w-sm flex flex-col">
            <div class="w-full flex justify-between mb-2"><h2 class="font-bold dark:text-white">Draw</h2><button onclick="closeDrawModal()" class="text-red-500">✕</button></div>
            <canvas id="sketchpad" width="300" height="300" class="border rounded-lg bg-white touch-none mx-auto"></canvas>
            <div class="w-full flex justify-between mt-4">
                <div class="flex gap-2"><button onclick="setBrushColor('#ef4444')" class="w-6 h-6 rounded-full bg-red-500 border border-black"></button><button onclick="setBrushColor('#3b82f6')" class="w-6 h-6 rounded-full bg-blue-500 border border-black"></button><button onclick="setBrushColor('#22c55e')" class="w-6 h-6 rounded-full bg-green-500 border border-black"></button><button onclick="setBrushColor('#000000')" class="w-6 h-6 rounded-full bg-black border border-black"></button><button onclick="clearCanvas()" class="px-2 text-xs bg-slate-200 rounded">Clear</button></div>
                <button onclick="sendSketch()" class="bg-blue-600 text-white px-4 rounded-lg">Send</button>
            </div>
        </div>
    </div>

    <!-- AUTH SCREEN -->
    <div id="auth-screen" class="w-full max-w-md bg-white dark:bg-slate-800 rounded-2xl shadow-2xl p-8 transition-all mx-4">
        <div class="text-center mb-6"><h1 class="text-2xl font-bold text-slate-800 dark:text-white">Boss Login</h1></div>
        <div class="space-y-3">
            <input type="text" id="username" class="w-full px-4 py-2 border rounded-lg dark:bg-slate-700 dark:text-white outline-none" placeholder="Username">
            <input type="password" id="password" class="w-full px-4 py-2 border rounded-lg dark:bg-slate-700 dark:text-white outline-none" placeholder="Password">
            <input type="text" id="phone" class="w-full px-4 py-2 border rounded-lg dark:bg-slate-700 dark:text-white outline-none hidden" placeholder="Phone (For Signup)">
            <button onclick="authenticate('login')" class="w-full bg-blue-600 text-white py-2.5 rounded-lg font-bold">Enter Secure Zone</button>
            <div class="flex justify-between text-sm mt-2"><button onclick="toggleSignup()" id="toggle-btn" class="text-blue-600 dark:text-blue-400">New? Sign Up</button></div>
            <p id="auth-msg" class="text-red-500 text-sm text-center"></p>
        </div>
    </div>

    <!-- MAIN APP -->
    <div id="app-screen" class="hidden w-full h-full sm:h-[95vh] sm:max-w-6xl sm:rounded-2xl bg-white dark:bg-slate-800 shadow-2xl flex overflow-hidden border dark:border-slate-700 transition-all">
        
        <!-- Sidebar -->
        <div id="sidebar" class="w-full sm:w-80 md:w-96 bg-white dark:bg-slate-800 border-r dark:border-slate-700 flex flex-col h-full z-10 transition-all">
            <div class="p-3 bg-slate-50 dark:bg-slate-900 border-b dark:border-slate-700 flex justify-between items-center h-16">
                <div class="flex items-center gap-2"><img id="my-avatar" src="" class="w-10 h-10 rounded-full border dark:border-slate-600"><span id="my-name-display" class="font-bold text-slate-800 dark:text-white text-sm"></span></div>
                <div class="flex items-center gap-2">
                    <button onclick="setAppPin()" class="text-lg hover:scale-110" title="Set PIN Lock">🔑</button>
                    <button onclick="toggleZenMode()" id="zen-btn" class="text-lg hover:scale-110" title="Zen Focus">🎧</button>
                    <button onclick="toggleDarkMode()" class="text-lg hover:scale-110" title="Dark Mode">🌙</button>
                    <button onclick="logout()" class="text-red-500 text-xs font-bold px-1">Logout</button>
                </div>
            </div>
            <div class="p-3 border-b dark:border-slate-700 bg-slate-50 dark:bg-slate-800">
                <div class="flex gap-2 items-center mb-2"><input type="text" id="status-input" placeholder="Type a status..." class="text-xs p-1.5 border rounded flex-1 dark:bg-slate-700 dark:text-white"><button onclick="postStatus()" class="bg-blue-500 text-white text-xs px-2 py-1.5 rounded">Post</button></div>
                <div class="flex gap-3 overflow-x-auto no-scrollbar pb-1" id="status-list"></div>
            </div>
            <div class="p-2 border-b dark:border-slate-700 bg-white dark:bg-slate-800">
                <div class="flex gap-1"><input type="text" id="search-input" placeholder="Search friends..." class="w-full text-xs p-2 bg-slate-100 dark:bg-slate-700 dark:text-white rounded outline-none"><button onclick="searchUser()" class="bg-blue-600 text-white text-xs px-3 rounded">Find</button></div>
                <div id="search-results" class="mt-1 space-y-1 text-xs"></div>
            </div>
            <div id="requests-list" class="divide-y divide-slate-100 dark:divide-slate-700 text-xs bg-yellow-50 dark:bg-yellow-900/20"></div>
            <div class="flex-1 overflow-y-auto bg-white dark:bg-slate-800" id="friends-list"></div>
        </div>

        <!-- Chat Area -->
        <div id="chat-container" class="flex-1 flex flex-col bg-slate-50 dark:bg-slate-900 relative w-full h-full hidden sm:flex transition-all">
            <!-- Header -->
            <div class="h-16 px-4 bg-white dark:bg-slate-800 border-b dark:border-slate-700 flex justify-between items-center shadow-sm z-10">
                <div class="flex items-center gap-3">
                    <button class="sm:hidden text-slate-500 font-medium" onclick="toggleMobileView(false)">←</button>
                    <img id="chat-avatar" src="" class="w-10 h-10 rounded-full hidden border">
                    <div>
                        <div class="flex items-center gap-2">
                            <h2 id="chat-with-name" class="font-semibold text-slate-800 dark:text-white text-base">Select a chat</h2>
                            <div id="typing-indicator" class="hidden flex items-center gap-1 text-[10px] text-blue-500 bg-blue-50 dark:bg-blue-900/30 px-2 py-0.5 rounded-full">Typing<span class="dot w-1 h-1 bg-blue-500 rounded-full"></span><span class="dot w-1 h-1 bg-blue-500 rounded-full"></span><span class="dot w-1 h-1 bg-blue-500 rounded-full"></span></div>
                        </div>
                        <p id="chat-status" class="text-[10px] text-slate-500 hidden">Encrypted</p>
                    </div>
                </div>
                
                <div class="flex gap-2 items-center flex-wrap">
                    <div class="relative hidden sm:block"><input type="text" id="local-chat-search" onkeyup="searchLocalChat()" placeholder="Search..." class="text-xs px-2 py-1 rounded border dark:bg-slate-700 dark:text-white w-20 focus:w-28 transition-all outline-none"></div>
                    <button onclick="cycleFontSize()" class="text-lg p-1 hover:scale-110" title="Text Size">🔠</button>
                    <button onclick="clearChatScreen()" class="text-lg p-1 hover:scale-110" title="Clear Chat">🧹</button>
                    <button onclick="toggleLock()" class="text-lg p-1 hover:scale-110" title="Privacy Lock">🔐</button>
                    <button onclick="cycleWallpaper()" class="text-lg p-1 hover:scale-110" title="Wallpaper">🎨</button>
                    <button id="audio-call-btn" onclick="startCall(false)" class="hidden bg-blue-100 dark:bg-blue-900/50 text-blue-700 p-2 rounded-full hover:bg-blue-200"><svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24"><path d="M6.62 10.79c1.44 2.83 3.76 5.14 6.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1-9.39 0-17-7.61-17-17 0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2z"></path></svg></button>
                    <button id="video-call-btn" onclick="startCall(true)" class="hidden bg-green-100 dark:bg-green-900/50 text-green-700 p-2 rounded-full hover:bg-green-200"><svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24"><path d="M15 10l4.5-2.5A1 1 0 0121 8.5v7a1 1 0 01-1.5.85L15 14v-4zM5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"></path></svg></button>
                </div>
            </div>
            
            <!-- Video Container -->
            <div id="video-container" class="hidden fixed inset-0 sm:absolute sm:inset-auto sm:top-20 sm:right-4 w-full h-full sm:w-[400px] sm:h-[300px] bg-slate-900 sm:rounded-2xl shadow-2xl overflow-hidden z-[100] flex flex-col group">
                <div class="absolute top-4 left-0 w-full flex justify-center z-10"><div id="call-timer" class="bg-black/50 text-white text-xs px-3 py-1 rounded-full border border-white/20">00:00</div></div>
                <div id="audio-avatar-placeholder" class="hidden w-full h-full flex flex-col items-center justify-center bg-slate-800 absolute inset-0 z-0"><img id="call-avatar-img" src="" class="w-32 h-32 rounded-full border-4 border-slate-600 animate-pulse mb-4"><span class="text-white font-medium">Audio Call</span></div>
                <video id="remote-video" class="w-full h-full object-cover z-0" autoplay playsinline></video>
                <video id="local-video" class="w-24 h-32 object-cover absolute top-4 right-4 border-2 border-white rounded-xl shadow-lg z-10" autoplay playsinline muted></video>
                <div class="absolute bottom-6 left-0 w-full flex justify-center gap-3 px-4 opacity-100 sm:opacity-0 group-hover:opacity-100 transition-opacity z-20">
                    <button id="mute-btn" onclick="toggleAudio()" class="bg-white/20 text-white p-3 rounded-full hover:bg-white/40">🎤</button>
                    <button id="cam-btn" onclick="toggleVideo()" class="bg-white/20 text-white p-3 rounded-full hover:bg-white/40">📷</button>
                    <button id="full-btn" onclick="toggleFullscreen()" class="hidden sm:block bg-white/20 text-white p-3 rounded-full hover:bg-white/40">⛶</button>
                    <button onclick="endCall()" class="bg-red-600 text-white p-3 px-5 rounded-full font-bold">End</button>
                </div>
            </div>

            <!-- Messages Box -->
            <div id="chat-box" class="flex-1 p-4 overflow-y-auto wp-default flex flex-col gap-2 pb-20 text-sm transition-all duration-300"></div>

            <!-- Input Area -->
            <div class="w-full bg-white dark:bg-slate-800 border-t dark:border-slate-700 flex flex-col relative z-20">
                <div id="reply-preview" class="hidden w-full bg-slate-100 dark:bg-slate-700 border-l-4 border-blue-500 p-2 text-xs flex justify-between items-center px-4">
                    <div class="truncate flex-1"><span class="font-bold text-blue-600 dark:text-blue-400">Replying to:</span> <span id="reply-text-preview" class="text-slate-600 dark:text-slate-300 ml-1"></span></div>
                    <button onclick="cancelReply()" class="text-slate-400 hover:text-red-500 font-bold ml-2">✕</button>
                </div>

                <div class="p-2 flex items-center gap-1 sm:gap-2 overflow-x-auto no-scrollbar">
                    <button id="bomb-btn" onclick="toggleBomb()" class="text-slate-400 hover:text-red-500 p-2 rounded-full" title="Self-Destruct">💣</button>
                    <button onclick="sendLocation()" class="text-slate-400 hover:text-green-500 p-2 rounded-full hidden sm:block" title="Location">📍</button>
                    <button onclick="openDrawModal()" class="text-slate-400 hover:text-purple-500 p-2 rounded-full hidden sm:block" title="Draw">✏️</button>
                    <button onclick="openSelfie()" class="text-slate-400 hover:text-orange-500 p-2 rounded-full hidden sm:block" title="Selfie">📸</button>
                    <button onclick="sendPoll()" class="text-slate-400 hover:text-teal-500 p-2 rounded-full hidden sm:block" title="Quick Poll">📊</button>
                    
                    <input type="file" id="file-input" class="hidden" onchange="handleFileSelect(event)">
                    <button onclick="document.getElementById('file-input').click()" class="text-slate-400 hover:text-blue-600 p-2 rounded-full" title="Attach">📎</button>
                    
                    <!-- 📻 PTT Walkie Talkie -->
                    <button id="ptt-btn" onmousedown="startPTT()" onmouseup="stopPTT()" ontouchstart="startPTT(event)" ontouchend="stopPTT(event)" class="text-slate-400 hover:text-blue-500 p-2 rounded-full bg-slate-100 dark:bg-slate-700 transition-all" title="Hold to Talk (Walkie Talkie)">📻</button>
                    
                    <input type="text" id="msg-input" placeholder="Message..." class="flex-1 min-w-[120px] bg-slate-100 dark:bg-slate-700 dark:text-white px-4 py-2.5 rounded-full text-sm outline-none" disabled>
                    
                    <!-- 🕒 Schedule Message -->
                    <button onclick="scheduleMessage()" class="text-slate-400 hover:text-amber-500 p-2 rounded-full" title="Schedule Message">🕒</button>
                    <button id="send-btn" onclick="sendMessage()" class="bg-blue-600 text-white p-2.5 rounded-full disabled:bg-slate-400 hover:bg-blue-700" disabled>➤</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const getAvatar = (name) => `https://ui-avatars.com/api/?name=${name}&background=random&color=fff`;

        // 🔢 PIN LOCK LOGIC
        const savedPin = localStorage.getItem('app_pin');
        if(savedPin) {
            document.getElementById('pin-lock-overlay').classList.remove('hidden');
            const pinInput = document.getElementById('unlock-pin-input');
            pinInput.addEventListener('keypress', (e) => {
                if(e.key === 'Enter') unlockApp();
            });
        }
        function unlockApp() {
            const input = document.getElementById('unlock-pin-input').value;
            if(input === localStorage.getItem('app_pin')) {
                document.getElementById('pin-lock-overlay').classList.add('hidden');
            } else {
                document.getElementById('pin-error').classList.remove('hidden');
            }
        }
        function setAppPin() {
            const current = localStorage.getItem('app_pin');
            if(current) {
                if(confirm("Remove current PIN lock?")) localStorage.removeItem('app_pin');
            } else {
                const pin = prompt("Enter a 4-digit PIN to lock your app:");
                if(pin && pin.length >= 4) { localStorage.setItem('app_pin', pin); alert("PIN Set Successfully!"); }
            }
        }

        // 📶 OFFLINE MONITOR
        window.addEventListener('offline', () => document.getElementById('offline-banner').classList.remove('hidden'));
        window.addEventListener('online', () => document.getElementById('offline-banner').classList.add('hidden'));

        // 🔐 BOSS PRIVACY LOCK
        let isLocked = false;
        function toggleLock() { const c = document.getElementById('app-screen'); const o = document.getElementById('lock-overlay'); isLocked = !isLocked; if(isLocked) { c.classList.add('locked-blur'); o.classList.remove('hidden'); } else { c.classList.remove('locked-blur'); o.classList.add('hidden'); } }

        // 🔠 FONT RESIZER
        const fonts = ['text-sm', 'text-base', 'text-lg']; let currentFont = 0;
        function cycleFontSize() { const box = document.getElementById('chat-box'); box.classList.remove(fonts[currentFont]); currentFont = (currentFont + 1) % fonts.length; box.classList.add(fonts[currentFont]); }

        // 🧹 CLEAR CHAT SCREEN
        function clearChatScreen() { if(confirm("Clear current screen?")) document.getElementById('chat-box').innerHTML = ''; }

        // 🔍 LOCAL CHAT SEARCH
        function searchLocalChat() {
            const q = document.getElementById('local-chat-search').value.toLowerCase();
            document.querySelectorAll('.chat-bubble-container').forEach(msg => {
                if(msg.innerText.toLowerCase().includes(q)) msg.classList.remove('hidden'); else msg.classList.add('hidden');
            });
        }

        // 🎧 ZEN FOCUS MODE
        let zenCtx, zenOsc1, zenOsc2, isZenOn = false;
        function toggleZenMode() {
            const btn = document.getElementById('zen-btn');
            if(!isZenOn) {
                zenCtx = new (window.AudioContext || window.webkitAudioContext)();
                zenOsc1 = zenCtx.createOscillator(); zenOsc2 = zenCtx.createOscillator();
                const gain = zenCtx.createGain(); gain.gain.value = 0.05;
                zenOsc1.type = 'sine'; zenOsc1.frequency.value = 150; zenOsc2.type = 'triangle'; zenOsc2.frequency.value = 100;
                zenOsc1.connect(gain); zenOsc2.connect(gain); gain.connect(zenCtx.destination);
                zenOsc1.start(); zenOsc2.start(); isZenOn = true; btn.classList.add('text-blue-500', 'animate-pulse');
            } else { if(zenCtx) zenCtx.close(); isZenOn = false; btn.classList.remove('text-blue-500', 'animate-pulse'); }
        }

        // 📸 SELFIE CAMERA
        let selfieStream;
        async function openSelfie() { if(!chatConn?.open) return alert("Connect first!"); document.getElementById('selfie-modal').classList.remove('hidden'); try { selfieStream = await navigator.mediaDevices.getUserMedia({video: true}); document.getElementById('selfie-video').srcObject = selfieStream; } catch(e) { alert("Camera not found!"); closeSelfie(); } }
        function closeSelfie() { document.getElementById('selfie-modal').classList.add('hidden'); if(selfieStream) selfieStream.getTracks().forEach(t => t.stop()); }
        function captureSelfie() { const v = document.getElementById('selfie-video'); const c = document.getElementById('selfie-canvas'); c.width = v.videoWidth; c.height = v.videoHeight; c.getContext('2d').drawImage(v, 0, 0); const b64 = c.toDataURL('image/jpeg', 0.8); const id = "msg_"+Date.now(); chatConn.send({ type: 'file', mime: 'image/jpeg', content: CryptoJS.AES.encrypt(b64, "boss_key").toString(), msgId: id }); displayMsg(b64, true, 'file', 'image/jpeg', id); closeSelfie(); }

        // Existing Themes
        const wallpapers = ['wp-default', 'wp-blue', 'wp-pink']; let currentWpIndex = parseInt(localStorage.getItem('chat_wp') || '0'); document.getElementById('chat-box').classList.add(wallpapers[currentWpIndex]);
        function cycleWallpaper() { document.getElementById('chat-box').classList.remove(wallpapers[currentWpIndex]); currentWpIndex = (currentWpIndex + 1) % wallpapers.length; localStorage.setItem('chat_wp', currentWpIndex); document.getElementById('chat-box').classList.add(wallpapers[currentWpIndex]); }
        function toggleDarkMode() { document.documentElement.classList.toggle('dark'); localStorage.setItem('theme', document.documentElement.classList.contains('dark') ? 'dark' : 'light'); }
        if (localStorage.getItem('theme') === 'dark') document.documentElement.classList.add('dark');

        // Session
        let myUsername = localStorage.getItem('chat_user'), lastActivity = localStorage.getItem('last_active');
        let myPeerId = null, chatConn = null, peer = null, isSignup = false; window.msgStore = {}; let isBombMode = false;

        function checkSession() { if (myUsername && lastActivity) { if (new Date().getTime() - parseInt(lastActivity) > 5 * 60 * 1000) logout(); else { updateActivity(); initPeerAndLogin(); } } }
        function updateActivity() { localStorage.setItem('last_active', new Date().getTime()); }
        window.addEventListener('mousemove', updateActivity); window.addEventListener('keypress', updateActivity);
        setInterval(() => { if(myUsername && (new Date().getTime() - parseInt(localStorage.getItem('last_active')) > 5*60*1000)) logout(); }, 10000);

        function playPopSound() { try { const actx = new (window.AudioContext || window.webkitAudioContext)(); const osc = actx.createOscillator(), gain = actx.createGain(); osc.type = 'sine'; osc.frequency.setValueAtTime(800, actx.currentTime); osc.frequency.exponentialRampToValueAtTime(300, actx.currentTime + 0.1); gain.gain.setValueAtTime(0.5, actx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, actx.currentTime + 0.1); osc.connect(gain); gain.connect(actx.destination); osc.start(); osc.stop(actx.currentTime + 0.1); } catch(e){} }

        // 📻 WALKIE TALKIE (PTT) LOGIC
        let pttRecorder, pttChunks = [];
        async function startPTT(e) {
            if(e) e.preventDefault();

                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                pttRecorder = new MediaRecorder(stream); pttRecorder.ondataavailable = ev => pttChunks.push(ev.data);

                    const audioBlob = new Blob(pttChunks, { type: 'audio/webm' }); pttChunks = [];
                    const reader = new FileReader(); reader.onload = (ev) => {
                        const b64 = ev.target.result; const id = "msg_"+Date.now();

                        displayMsg(b64, true, 'file', 'audio/webm', id);
                    }; reader.readAsDataURL(audioBlob);

        // Draw Setup
        const canvas = document.getElementById('sketchpad'); const ctx = canvas.getContext('2d'); let isDrawing = false, brushColor = '#000000';
        function openDrawModal() { document.getElementById('draw-modal').classList.remove('hidden'); clearCanvas(); }
        function closeDrawModal() { document.getElementById('draw-modal').classList.add('hidden'); }
        function setBrushColor(c) { brushColor = c; } function clearCanvas() { ctx.fillStyle = 'white'; ctx.fillRect(0, 0, canvas.width, canvas.height); }
        function getPos(e) { const rect = canvas.getBoundingClientRect(); const cx = e.touches ? e.touches[0].clientX : e.clientX; const cy = e.touches ? e.touches[0].clientY : e.clientY; return { x: cx - rect.left, y: cy - rect.top }; }
        canvas.addEventListener('mousedown', (e) => { isDrawing = true; ctx.beginPath(); const p = getPos(e); ctx.moveTo(p.x, p.y); }); canvas.addEventListener('mousemove', (e) => { if(isDrawing) { const p = getPos(e); ctx.lineTo(p.x, p.y); ctx.strokeStyle = brushColor; ctx.lineWidth = 3; ctx.lineCap = 'round'; ctx.stroke(); } }); canvas.addEventListener('mouseup', () => isDrawing = false); canvas.addEventListener('touchstart', (e) => { e.preventDefault(); isDrawing = true; ctx.beginPath(); const p = getPos(e); ctx.moveTo(p.x, p.y); }); canvas.addEventListener('touchmove', (e) => { e.preventDefault(); if(isDrawing) { const p = getPos(e); ctx.lineTo(p.x, p.y); ctx.strokeStyle = brushColor; ctx.lineWidth = 3; ctx.lineCap = 'round'; ctx.stroke(); } }); canvas.addEventListener('touchend', () => isDrawing = false);
        function sendSketch() { if(!chatConn?.open) { alert("Connect to friend first!"); closeDrawModal(); return; } const b64 = canvas.toDataURL('image/png'); const id = "msg_"+Date.now(); chatConn.send({ type: 'file', mime: 'image/png', content: CryptoJS.AES.encrypt(b64, "boss_key").toString(), msgId: id }); displayMsg(b64, true, 'file', 'image/png', id); closeDrawModal(); }

        function formatText(txt) { if(txt.includes('```')) return txt.replace(/```([\s\S]*?)```/g, '<pre class="bg-slate-800 text-green-400 p-2 rounded text-xs font-mono my-1 overflow-x-auto whitespace-pre-wrap"><code>$1</code></pre>'); return txt.replace(/\*(.*?)\*/g, '<b>$1</b>').replace(/_(.*?)_/g, '<i>$1</i>').replace(/~(.*?)~/g, '<del>$1</del>'); }

        function setupPeerListeners() { peer.on('connection', (conn) => setupConnection(conn)); peer.on('call', async (call) => { const isVideo = call.metadata ? call.metadata.video : true; const msg = isVideo ? "Incoming video call... Accept?" : "Incoming audio call... Accept?"; if(confirm(msg)) { try { localStream = await navigator.mediaDevices.getUserMedia({video: isVideo, audio: true}); if(isVideo) document.getElementById('local-video').srcObject = localStream; call.answer(localStream); setupVideoUI(call, isVideo); } catch(e) {} } else call.close(); }); }

        function setupConnection(conn) {
            chatConn = conn; conn.on('open', () => { msgInput.disabled = false; document.getElementById('send-btn').disabled = false; document.getElementById('audio-call-btn').classList.remove('hidden'); document.getElementById('video-call-btn').classList.remove('hidden'); });
            conn.on('data', (data) => {
                if(data.type === 'typing') { const ind = document.getElementById('typing-indicator'); ind.classList.remove('hidden'); clearTimeout(typingTimeout); typingTimeout = setTimeout(() => ind.classList.add('hidden'), 2000); }
                else if(data.type === 'delete') { const el = document.getElementById(data.msgId); if(el) el.outerHTML = ""; }
                else if(data.type === 'soft_delete') { const el = document.getElementById(data.msgId); if(el) el.innerHTML = `<span class="italic text-slate-500">🚫 This message was deleted</span>`; }
                else if(data.type === 'reaction') { const rEl = document.getElementById('react_'+data.msgId); if(rEl) { rEl.innerHTML = data.emoji; rEl.classList.add('reaction-pop'); } }

                else if(data.type === 'poll') { displayPoll(data.question, false, data.msgId); playPopSound(); if(navigator.vibrate) navigator.vibrate([200]); }

                    const dec = CryptoJS.AES.decrypt(data.content, "boss_key").toString(CryptoJS.enc.Utf8); 
                    const decReply = data.reply ? CryptoJS.AES.decrypt(data.reply, "boss_key").toString(CryptoJS.enc.Utf8) : null;

                    if(data.bomb) setTimeout(() => { deleteMsg(data.msgId, true); }, 10000);
                }

                    displayMsg(decB64, false, 'file', data.mime, data.msgId); playPopSound(); if(navigator.vibrate) navigator.vibrate([200]);
                    if(document.visibilityState === 'visible') chatConn.send({type: 'read', msgId: data.msgId});
                }
            });
        }

        }

        window.startCall = async function(isVideo) { try { localStream = await navigator.mediaDevices.getUserMedia({video: isVideo, audio: true}); if(isVideo) document.getElementById('local-video').srcObject = localStream; const call = peer.call(activePeerId, localStream, { metadata: { video: isVideo } }); setupVideoUI(call, isVideo); } catch(e) { alert("Mic/Camera permission required!"); } };
        function setupVideoUI(call, isVideo) { currentCallIsVideo = isVideo; document.getElementById('video-container').classList.remove('hidden'); if(!isVideo) { document.getElementById('audio-avatar-placeholder').classList.remove('hidden'); document.getElementById('call-avatar-img').src = getAvatar(activeFriend); document.getElementById('local-video').classList.add('hidden'); document.getElementById('remote-video').classList.add('hidden'); document.getElementById('cam-btn').classList.add('hidden'); document.getElementById('screen-btn').classList.add('hidden'); document.getElementById('full-btn').classList.add('hidden'); } else { document.getElementById('audio-avatar-placeholder').classList.add('hidden'); document.getElementById('local-video').classList.remove('hidden'); document.getElementById('remote-video').classList.remove('hidden'); document.getElementById('cam-btn').classList.remove('hidden'); document.getElementById('screen-btn').classList.remove('hidden'); document.getElementById('full-btn').classList.remove('hidden'); } call.on('stream', rStream => { if(isVideo) document.getElementById('remote-video').srcObject = rStream; else { const audioEl = new Audio(); audioEl.srcObject = rStream; audioEl.play(); window.currentRemoteAudio = audioEl; } }); call.on('close', endCall); currentCall = call; audioEnabled = true; videoEnabled = isVideo; document.getElementById('mute-btn').textContent = '🎤'; document.getElementById('cam-btn').textContent = '📷'; document.getElementById('mute-btn').classList.remove('bg-red-500'); document.getElementById('cam-btn').classList.remove('bg-red-500'); callSeconds = 0; document.getElementById('call-timer').textContent = "00:00"; clearInterval(callTimerInterval); callTimerInterval = setInterval(() => { callSeconds++; document.getElementById('call-timer').textContent = formatTime(callSeconds); }, 1000); }
        async function shareScreen() { if(!currentCall || !currentCallIsVideo) return; try { const screenStream = await navigator.mediaDevices.getDisplayMedia({video: true}); const screenTrack = screenStream.getVideoTracks()[0]; const sender = currentCall.peerConnection.getSenders().find(s => s.track.kind === 'video'); sender.replaceTrack(screenTrack); document.getElementById('local-video').srcObject = screenStream; screenTrack.onended = () => { const camTrack = localStream.getVideoTracks()[0]; sender.replaceTrack(camTrack); document.getElementById('local-video').srcObject = localStream; }; } catch(e) {} }
        function toggleAudio() { if(!localStream) return; audioEnabled = !audioEnabled; localStream.getAudioTracks()[0].enabled = audioEnabled; document.getElementById('mute-btn').textContent = audioEnabled ? '🎤' : '🔇'; document.getElementById('mute-btn').classList.toggle('bg-red-500', !audioEnabled); }
        function toggleVideo() { if(!localStream || !currentCallIsVideo) return; videoEnabled = !videoEnabled; localStream.getVideoTracks()[0].enabled = videoEnabled; document.getElementById('cam-btn').textContent = videoEnabled ? '📷' : '🚫'; document.getElementById('cam-btn').classList.toggle('bg-red-500', !videoEnabled); }
        function toggleFullscreen() { const vc = document.getElementById('video-container'); if(!isFull) { vc.classList.add('fixed', 'inset-0', 'w-full', 'h-full', 'rounded-none'); vc.classList.remove('sm:absolute', 'sm:inset-auto', 'sm:top-20', 'sm:right-4', 'sm:w-[400px]', 'sm:h-[300px]', 'sm:rounded-2xl'); } else { vc.classList.remove('fixed', 'inset-0', 'w-full', 'h-full', 'rounded-none'); vc.classList.add('sm:absolute', 'sm:inset-auto', 'sm:top-20', 'sm:right-4', 'sm:w-[400px]', 'sm:h-[300px]', 'sm:rounded-2xl'); } isFull = !isFull; }
        function endCall() { clearInterval(callTimerInterval); if(currentCall) currentCall.close(); if(localStream) localStream.getTracks().forEach(t => t.stop()); if(window.currentRemoteAudio) { window.currentRemoteAudio.pause(); window.currentRemoteAudio = null; } document.getElementById('video-container').classList.add('hidden'); }
        function logout() { localStorage.removeItem('chat_user'); localStorage.removeItem('last_active'); localStorage.removeItem('theme'); location.reload(); }
        async function requestOTP() { const u = document.getElementById('reset-user').value; const p = document.getElementById('reset-phone').value; const res = await fetch('/request_otp', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({username: u, phone: p})}); const data = await res.json(); if(data.success) { alert("TESTING MODE: Your OTP is " + data.demo_otp); document.getElementById('otp-step-1').classList.add('hidden'); document.getElementById('otp-step-2').classList.remove('hidden'); } else { document.getElementById('reset-msg').textContent = data.error; } }
        async function verifyOTP() { const u = document.getElementById('reset-user').value; const otp = document.getElementById('reset-otp').value; const np = document.getElementById('reset-new-pass').value; const res = await fetch('/reset_password', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({username: u, otp: otp, new_password: np})}); const data = await res.json(); if(data.success) { alert("Password Reset Successfully!"); location.reload(); } else { document.getElementById('reset-msg').textContent = data.error; } }
        window.addEventListener('focus', () => { if(chatConn && chatConn.open) { const msgs = document.querySelectorAll('.chat-bubble-container'); msgs.forEach(m => { const id = m.id; chatConn.send({type: 'read', msgId: id}); }); } });

        checkSession();
    </script>
</body>
</html>
